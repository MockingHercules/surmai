<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Surmai pixel fish logo</title>
  <desc id="desc">A pixel-art silver surmai fish mark with a dark outline, teal tail, and gold eye.</desc>
  <rect width="160" height="160" rx="28" fill="#162226"/>
  <g shape-rendering="crispEdges">
    <!-- Pixel shadow gives the mark weight at small sizes. -->
    <rect x="34" y="70" width="12" height="12" fill="#0c171a"/>
    <rect x="46" y="58" width="12" height="12" fill="#0c171a"/>
    <rect x="58" y="46" width="48" height="12" fill="#0c171a"/>
    <rect x="106" y="58" width="12" height="12" fill="#0c171a"/>
    <rect x="118" y="70" width="12" height="12" fill="#0c171a"/>
    <rect x="106" y="82" width="12" height="12" fill="#0c171a"/>
    <rect x="58" y="94" width="48" height="12" fill="#0c171a"/>
    <rect x="46" y="82" width="12" height="12" fill="#0c171a"/>

    <!-- Teal tail: the memorable brand signal. -->
    <rect x="22" y="58" width="12" height="12" fill="#34746f"/>
    <rect x="10" y="70" width="24" height="12" fill="#34746f"/>
    <rect x="22" y="82" width="12" height="12" fill="#34746f"/>
    <rect x="34" y="70" width="12" height="12" fill="#c7d2d1"/>

    <!-- Silver surmai body. -->
    <rect x="46" y="58" width="12" height="12" fill="#eef1ef"/>
    <rect x="58" y="46" width="48" height="12" fill="#eef1ef"/>
    <rect x="58" y="58" width="60" height="12" fill="#dfe6e3"/>
    <rect x="46" y="70" width="84" height="12" fill="#c7d2d1"/>
    <rect x="58" y="82" width="60" height="12" fill="#aebcbd"/>
    <rect x="58" y="94" width="48" height="12" fill="#75878b"/>

    <!-- Signature surmai stripe. -->
    <rect x="58" y="70" width="48" height="12" fill="#87959a"/>
    <rect x="106" y="70" width="12" height="12" fill="#eef1ef"/>

    <!-- Nose, eye, and small dorsal pixel. -->
    <rect x="118" y="70" width="12" height="12" fill="#eef1ef"/>
    <rect x="106" y="58" width="12" height="12" fill="#c7d2d1"/>
    <rect x="106" y="82" width="12" height="12" fill="#87959a"/>
    <rect x="100" y="52" width="12" height="12" fill="#34746f"/>
    <rect x="118" y="58" width="12" height="12" fill="#a99664"/>
    <rect x="122" y="62" width="4" height="4" fill="#162226"/>
  </g>
</svg>
